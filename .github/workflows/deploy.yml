name: Staging Deployment on Windows 11

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
      
        # Chính chủ ko động vào
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        shell: powershell
        run: |
          # Lấy IP LAN của máy host để gán vào biến môi trường frontend
          $lanIp = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -like "*Wi-Fi*" -or $_.InterfaceAlias -like "*Ethernet*" } | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1).IPAddress
          
          # Ghi đè hoặc tạo file .env phục vụ build container
          @"
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          LAN_IP=$lanIp
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Deploy Containers with Docker Compose
        shell: powershell
        run: |
          $envContent = "DATABASE_URL=${{ secrets.DATABASE_URL }}`nNEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}"
          [System.IO.File]::WriteAllText("$PWD\.env", $envContent)
          docker compose up -d --build
          docker image prune -f