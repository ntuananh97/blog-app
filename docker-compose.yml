services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped # Quan trọng: Tự khởi động lại khi crash hoặc reboot server
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
  
  web:
    build: 
      context: ./client
      dockerfile: Dockerfile
      secrets:
        - env_file
    container_name: client
    restart: unless-stopped # Quan trọng: Tự khởi động lại khi crash hoặc reboot server
    env_file:
      - ./client/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
  
  secrets:
    env_file:
      file: ./client/.env
      
    
    
    
